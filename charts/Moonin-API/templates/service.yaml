apiVersion: v1
kind: Service
metadata:
  name: {{ include "Moonin-API.fullname" . }}
  labels:
    {{- include "Moonin-API.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.servicePort }}
      targetPort: {{ .Values.service.servicePort }}
      protocol: TCP
      name: service
    - port: {{ .Values.service.backendPort }}
      targetPort: {{ .Values.service.backendPort }}
      protocol: TCP
      name: backend
  selector:
    {{- include "Moonin-API.selectorLabels" . | nindent 4 }}
