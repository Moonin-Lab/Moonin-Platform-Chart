apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moonin-chatbot-api.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "moonin-chatbot-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "moonin-chatbot-api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: chatbot-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: db-secret, key: DATABASE_URL } }
            - name: MCP_INTERNAL_URL
              value: {{ .Values.mcpInternalUrl | quote }}
            - name: CHATBOT_GATEWAY_SECRET
              valueFrom: { secretKeyRef: { name: moonin-chatbot, key: gateway-secret } }
            - name: MCP_DELEGATION_SECRET
              valueFrom: { secretKeyRef: { name: moonin-ai-delegation, key: secret } }
            - name: MOONIN_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ required "moonin-chatbot-api.license.existingSecret is required" .Values.license.existingSecret | quote }}
                  key: {{ required "moonin-chatbot-api.license.key is required" .Values.license.key | quote }}
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
