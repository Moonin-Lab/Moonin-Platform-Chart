apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "Moonin-MCP-Server.fullname" . }}
  labels:
    {{- include "Moonin-MCP-Server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "Moonin-MCP-Server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "Moonin-MCP-Server.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "Moonin-MCP-Server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: db-secret
          env:
            - name: RUST_LOG
              value: debug
            - name: MOONIN_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ required "moonin-mcp-server.license.existingSecret is required" .Values.license.existingSecret | quote }}
                  key: {{ required "moonin-mcp-server.license.key is required" .Values.license.key | quote }}
            - name: MCP_BIND_HOST
              value: "0.0.0.0"
            - name: MCP_BIND_PORT
              value: "{{ .Values.service.containerPort }}"
            - name: PORTAL_MCP_DELEGATION_ENABLED
              value: {{ .Values.portalDelegation.enabled | quote }}
            - name: PORTAL_DELEGATION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.portalDelegation.secret.name }}
                  key: {{ .Values.portalDelegation.secret.key }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
