{{- if .Values.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "moonin-notifier-engine.redisFullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-notifier-engine.labels" . | nindent 4 }}
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode no
    port {{ .Values.redis.port }}
    appendonly no
    save ""
    maxmemory {{ .Values.redis.maxmemory }}
    maxmemory-policy {{ .Values.redis.maxmemoryPolicy }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moonin-notifier-engine.redisFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-notifier-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "moonin-notifier-engine.redisFullname" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: telemetry-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "moonin-notifier-engine.redisFullname" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: telemetry-redis
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - /usr/local/etc/redis/redis.conf
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
              protocol: TCP
          volumeMounts:
            - name: redis-config
              mountPath: /usr/local/etc/redis
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-config
          configMap:
            name: {{ include "moonin-notifier-engine.redisFullname" . }}-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moonin-notifier-engine.redisFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-notifier-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: telemetry-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "moonin-notifier-engine.redisFullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: telemetry-redis
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
{{- end }}
