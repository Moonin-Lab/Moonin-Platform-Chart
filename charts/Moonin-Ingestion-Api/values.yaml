nameOverride: ""
fullnameOverride: ""

api:
  enabled: true

workers:
  enabled: false
  image:
    repository: us-central1-docker.pkg.dev/arguz-prod/arguz/arguz-ingestion-worker
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  queueGroupPrefix: ingestion-worker
  clickhouseWriteConcurrency: 8
  leaseDuration: 30s
  heartbeatInterval: 10s
  leaseSweepInterval: 10s
  jetstream:
    enabled: true
    streamName: INGESTION
    subjectPattern: ingestion.v2.*.*.lane.*
    ackWait: 120s
    maxDeliver: 20
    maxAge: 168h
    maxBytes: 400Gi
    replicas: 3
    fetchBatch: 300
    fetchMaxWait: 3s
    nakDelay: 2s
  serviceAccount:
    create: false
    name: arguz-ingestion-workers
    annotations: {}
  pool:
    metrics:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    events:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    traces:
      replicas: 2
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

clickhouse:
  existingSecret: ""
  dsnKey: CLICKHOUSE_DSN
  database: moonin
  replicationPath: /clickhouse/tables/{shard}
  replicaName: "{replica}"
  requireReplication: true
  asyncInsert: true
  waitForAsyncInsert: true

jetstreamBootstrap:
  enabled: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 300

queryApi:
  enabled: false
  image:
    repository: us-central1-docker.pkg.dev/arguz-prod/arguz/arguz-ingestion-query-api
    pullPolicy: IfNotPresent
    tag: "0.1.0"
  serviceAccount:
    create: false
    name: arguz-ingestion-query-api
    automount: true
    annotations: {}
  service:
    type: ClusterIP
    port: 8082
  env:
    listenAddr: ":8082"
    internalTokenHeader: x-internal-token
    pageCacheTtl: 60s
    pageCacheMax: "30000"
    clusterConfigCacheTtl: 300s
    clusterConfigCacheMax: "10000"
    redisEnabled: "false"
    redisAddr: ""
    redisPassword: ""
    redisDb: "0"
    redisPrefix: "query-api"
    redisTimeout: 2s
  redis:
    enabled: false
    image: redis:7.4-alpine
    port: 6379
    maxmemory: 1gb
    maxmemoryPolicy: allkeys-lru
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

environment: production

image:
  repository: us-central1-docker.pkg.dev/arguz-prod/arguz/arguz-ingestion-api
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  automount: true
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

databaseSecret:
  name: db-secret
  key: DATABASE_URL

# Shared signed license used by API, Worker, Query API and the JetStream
# bootstrap Job. It must exist in the Helm release namespace.
license:
  existingSecret: moonin-license
  key: MOONIN_LICENSE

env:
  natsUrl: nats://nats.nats.svc.cluster.local:4222
  natsSubjectEnv: production
  clusterAuthCacheTtlSeconds: "60"
  clusterAuthCacheMax: "10000"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 60

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

pdb:
  enabled: false
  minAvailable: 1

ingress:
  enabled: false
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: ingestion-api.arguz.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: arguz-app-tls
      hosts:
        - ingestion-api.arguz.io

nodeSelector: {}
tolerations: []
affinity: {}
