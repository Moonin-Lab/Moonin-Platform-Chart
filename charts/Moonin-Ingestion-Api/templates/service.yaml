{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "moonin-ingestion-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-ingestion-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "moonin-ingestion-api.selectorLabels" . | nindent 4 }}
{{- end }}
