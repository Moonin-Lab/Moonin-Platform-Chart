{{- if and .Values.queryApi.enabled .Values.queryApi.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moonin-ingestion-api.queryServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-ingestion-api.queryLabels" . | nindent 4 }}
  {{- with .Values.queryApi.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.queryApi.serviceAccount.automount }}
{{- end }}
