{{- if and .Values.workers.enabled .Values.workers.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "moonin-ingestion-api.workerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-ingestion-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
  {{- with .Values.workers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
