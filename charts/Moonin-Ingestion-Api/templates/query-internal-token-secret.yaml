{{- if .Values.queryApi.enabled }}
{{- $secretName := printf "%s-auth" (include "moonin-ingestion-api.queryFullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $token := "" -}}
{{- if and $existing $existing.data (hasKey $existing.data "internal-token") -}}
{{- $token = index $existing.data "internal-token" -}}
{{- else -}}
{{- $token = (randAlphaNum 48 | b64enc) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moonin-ingestion-api.queryLabels" . | nindent 4 }}
type: Opaque
data:
  internal-token: {{ $token | quote }}
{{- end }}
