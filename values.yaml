moonin-ingestion-api:
  environment: production

  license:
    existingSecret: moonin-license
    key: MOONIN_LICENSE

  image:
    repository: ghcr.io/moonin-lab/moonin-platform/moonin-ingestion-api
    pullPolicy: IfNotPresent
    tag: "20261004-jetstream-fix"

  api:
    enabled: true

  serviceAccount:
    create: true
    name: ""

  databaseSecret:
    name: db-secret
    key: DATABASE_URL

  workers:
    enabled: true
    clickhouseWriteConcurrency: 8
    jetstream:
      subjectPattern: ingestion.v2.*.*.lane.*
      maxAge: 168h
      # This must fit in JetStream's max_file_store on every NATS replica.
      # Moonin Installer provisions 50Gi by default, so reserve headroom for
      # stream metadata and temporary recovery files instead of requesting it
      # all for the ingestion stream.
      maxBytes: 40Gi
      replicas: 3
    pool:
      metrics:
        replicas: 2
      events:
        replicas: 2
      traces:
        replicas: 2
    serviceAccount:
      create: false
      name: arguz-ingestion-workers
    image:
      repository: ghcr.io/moonin-lab/moonin-platform/moonin-ingestion-worker
      pullPolicy: IfNotPresent
      # This image bootstraps through ClickHouse's built-in default database,
      # so first deployment can create the Moonin analytics database safely.
      tag: "20261002-234600"

  clickhouse:
    # Create this Secret before deployment. It contains CLICKHOUSE_DSN.
    existingSecret: moonin-clickhouse-connection
    dsnKey: CLICKHOUSE_DSN
    database: moonin
    replicationPath: /clickhouse/tables/{shard}
    replicaName: "{replica}"
    requireReplication: true
    asyncInsert: true
    waitForAsyncInsert: true

  bootstrapClickHouse:
    enabled: true
    backoffLimit: 1
    ttlSecondsAfterFinished: 300

  queryApi:
    enabled: true
    serviceAccount:
      create: false
      name: arguz-ingestion-query-api
    env:
      redisEnabled: "true"
      redisAddr: "moonin-platform-query-redis:6379"
    redis:
      enabled: true
    image:
      repository: ghcr.io/moonin-lab/moonin-platform/moonin-ingestion-query-api
      pullPolicy: IfNotPresent
      tag: "20260928-121901"

  jetstreamBootstrap:
    enabled: true
    # One failed pre-install attempt is enough to surface a configuration
    # problem. Helm's atomic rollback then keeps the cluster clean.
    backoffLimit: 1

  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: api-ingestion.moonin.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: moonin-app-tls
        hosts:
          - api-ingestion.moonin.app

# Moonin Billing & AISync configuration
moonin-billing-sync:
  # SaaS-only optional service. Set false for customer installations to omit
  # the CronJob completely; runtime licensing enforces the same restriction.
  enabled: true
  # Keep the CronJob with moonin-license and db-secret. Kubernetes Secrets are
  # namespace-scoped, so this must match the Platform release namespace.
  namespace: moonin

  schedule: "*/30 * * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2

  maxConcurrentHours: 4

  image:
    repository: ghcr.io/moonin-lab/moonin-platform/moonin-billing-sync
    pullPolicy: IfNotPresent
    tag: "20260927153242"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  dbSecret:
    name: db-secret
    key: DATABASE_URL
  # This Secret exists in the same namespace as the Platform release.
  license:
    existingSecret: moonin-license
    key: MOONIN_LICENSE

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 10m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

moonin-ai-sync:
  # SaaS-only optional service. Set false for customer installations to omit
  # the CronJob completely; runtime licensing enforces the same restriction.
  enabled: true
  # Keep the CronJob with moonin-license and db-secret. Kubernetes Secrets are
  # namespace-scoped, so this must match the Platform release namespace.
  namespace: moonin

  # Optional pre-created Kubernetes ServiceAccount for cloud workload identity.
  serviceAccountName: ai-sync

  schedule: "*/30 * * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 2

  image:
    repository: ghcr.io/moonin-lab/moonin-platform/moonin-ai-sync
    pullPolicy: IfNotPresent
    tag: "20260927164852"

  nameOverride: ""
  fullnameOverride: ""

  # Leave empty to use the default model (google/gemini-2.5-flash-lite).
  aiModel: ""

  # Secret that holds DATABASE_URL.
  dbSecret:
    name: db-secret
    key: DATABASE_URL
  # This Secret exists in the same namespace as the Platform release.
  license:
    existingSecret: moonin-license
    key: MOONIN_LICENSE

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
