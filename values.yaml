      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 512Mi

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 30m
      memory: 50Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
