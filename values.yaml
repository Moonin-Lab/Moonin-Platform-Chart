moonin-api:
  replicaCount: 1
  image:
    repository: ghcr.io/moonin-lab/moonin-platform/moonin-api
    pullPolicy: IfNotPresent
    tag: "20260926201303"

  # Moonin API validates this signed license before starting. Kubernetes Secrets
  # are namespace-scoped: create this Secret in the namespace where this Helm
  # release is installed (currently `arguz`), not in a different namespace.
  license:
    existingSecret: moonin-license
    key: MOONIN_LICENSE

  # Secret in the release namespace containing the PostgreSQL connection used
  # by Moonin API. The installer creates this as db-secret by default.
  databaseSecret:
    existingSecret: db-secret

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  service:
    type: ClusterIP
    servicePort: 4000
    backendPort: 4001


  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - host: api-discovery.moonin.app
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: moonin-app-tls
        hosts:
          - api-discovery.moonin.app

  resources:
    limits:
      cpu: 300m
      memory: 400Mi
    requests:
      cpu: 50m
      memory: 50Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: 4001
  readinessProbe:
    httpGet:
      path: /healthz
      port: 4001

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 90
    targetMemoryUtilizationPercentage: 90
    
  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

